name: TfL → GCS Capture

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  capture:
    name: Capture TfL data → GCS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests google-cloud-storage google-auth

      - name: Capture TfL data → GCS
        env:
          TFL_APP_KEY:     ${{ secrets.TFL_APP_KEY }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python scripts/capture.py

      - name: Done
        if: always()
        run: echo "Finished at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
        
